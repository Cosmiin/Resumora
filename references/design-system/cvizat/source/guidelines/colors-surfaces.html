<!doctype html><html><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32.png"><link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png"><link rel="manifest" href="../assets/favicon/site.webmanifest"><meta name="theme-color" content="#17695d"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}.sw{display:grid;gap:6px}.chip{height:64px;border-radius:10px;border:1px solid rgba(23,59,57,.08)}.n{font:600 .75rem var(--font-sans)}.v{font:400 .68rem var(--font-mono);color:var(--text-muted)}.g{display:grid;gap:12px}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><div class="chip" style="height:90px;background:var(--surface-page)"></div><div class="n">surface-page</div><div class="v">page</div></div><div class="sw"><div class="chip" style="height:90px;background:var(--surface-card)"></div><div class="n">surface-card</div><div class="v">card</div></div><div class="sw"><div class="chip" style="height:90px;background:var(--surface-sunken)"></div><div class="n">surface-sunken</div><div class="v">sunken / tabs</div></div><div class="sw"><div class="chip" style="height:90px;background:var(--surface-hero)"></div><div class="n">surface-hero</div><div class="v">hero / selected</div></div><div class="sw"><div class="chip" style="height:90px;background:var(--surface-inverse)"></div><div class="n">surface-inverse</div><div class="v">toast / inverse</div></div></div></body></html>
