<!doctype html><html><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32.png"><link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png"><link rel="manifest" href="../assets/favicon/site.webmanifest"><meta name="theme-color" content="#17695d"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}.sw{display:grid;gap:6px}.chip{height:64px;border-radius:10px;border:1px solid rgba(23,59,57,.08)}.n{font:600 .75rem var(--font-sans)}.v{font:400 .68rem var(--font-mono);color:var(--text-muted)}.g{display:grid;gap:12px}@keyframes fill{from{width:0}60%,to{width:100%}}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)"><div style="padding:14px;border:1px solid var(--border-subtle);border-radius:10px"><div class="n">fast · 120ms</div><div class="v">ease-out</div><div style="font-size:.78rem;margin-top:8px;color:var(--text-muted)">press, hover</div><div style="height:6px;border-radius:4px;background:var(--sage-150);margin-top:10px;overflow:hidden"><i style="display:block;height:100%;background:var(--pine-600);animation:fill 2.4s var(--ease-out) infinite"></i></div></div><div style="padding:14px;border:1px solid var(--border-subtle);border-radius:10px"><div class="n">base · 200ms</div><div class="v">ease-out</div><div style="font-size:.78rem;margin-top:8px;color:var(--text-muted)">expand, tabs</div><div style="height:6px;border-radius:4px;background:var(--sage-150);margin-top:10px;overflow:hidden"><i style="display:block;height:100%;background:var(--pine-600);animation:fill 2.4s var(--ease-out) infinite"></i></div></div><div style="padding:14px;border:1px solid var(--border-subtle);border-radius:10px"><div class="n">slow · 360ms</div><div class="v">ease-out</div><div style="font-size:.78rem;margin-top:8px;color:var(--text-muted)">bars fill</div><div style="height:6px;border-radius:4px;background:var(--sage-150);margin-top:10px;overflow:hidden"><i style="display:block;height:100%;background:var(--pine-600);animation:fill 2.4s var(--ease-out) infinite"></i></div></div><div style="padding:14px;border:1px solid var(--border-subtle);border-radius:10px"><div class="n">celebrate · 700ms</div><div class="v">ease-out</div><div style="font-size:.78rem;margin-top:8px;color:var(--text-muted)">score ring rise</div><div style="height:6px;border-radius:4px;background:var(--sage-150);margin-top:10px;overflow:hidden"><i style="display:block;height:100%;background:var(--pine-600);animation:fill 2.4s var(--ease-out) infinite"></i></div></div></div><div style="font-size:.78rem;color:var(--text-muted);margin-top:12px">Button press: translateY(2px) and drop the 2px under-shadow. Reduced-motion disables all.</div></body></html>
