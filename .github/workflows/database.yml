name: Database SQL and isolation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; same pin as foundation CI
        with:
          persist-credentials: false
      - name: Check preflight credential boundaries without network access
        run: python3 -m unittest discover -s supabase/tests -p test_preflight.py -v
      - name: Run PostgreSQL 16 synthetic migrations, RLS, races and populated upgrades
        run: python3 scripts/db/test.py --pg-bin /usr/lib/postgresql/16/bin --receipt /tmp/resumora-db-checks.json
