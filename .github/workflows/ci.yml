name: Local foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Install, types, build and local HTTP checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up pinned npm
        run: npm install --global npm@10.9.9 --ignore-scripts
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check types, build and local HTTP behavior
        run: npm run check
      - name: Check synthetic OpenAI accounting and protected admin routes
        run: npm test --workspace @resumora/api
